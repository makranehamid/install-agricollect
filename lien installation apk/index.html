<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Installation AgriCollectChefchaouen</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 flex items-center justify-center min-h-screen p-6">
    <div
        class="relative w-full max-w-md bg-white/90 backdrop-blur-xl rounded-[3rem] shadow-2xl p-8 border border-white/50 text-center overflow-hidden">

        <!-- Decorative Background Blow -->
        <div class="absolute top-0 left-0 w-full h-32 bg-gradient-to-b from-green-50 to-transparent"></div>

        <!-- Animated Icon Container -->
        <div class="relative z-10 w-32 h-32 mx-auto mb-6 group">
            <div
                class="absolute inset-0 bg-green-400 rounded-3xl blur-xl opacity-20 group-hover:opacity-40 transition-opacity duration-700 animate-pulse">
            </div>
            <div
                class="relative w-full h-full bg-white rounded-3xl shadow-lg ring-4 ring-white overflow-hidden transform transition-transform duration-500 group-hover:scale-105 group-hover:rotate-2">
                <img src="icon.jpg" alt="App Icon" class="w-full h-full object-cover"
                    onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=Agri+Collect&background=10B981&color=fff&size=128&font-size=0.33'">
            </div>
        </div>

        <!-- Title Section -->
        <div class="relative z-10 space-y-1 mb-8">
            <h1 class="text-3xl font-black text-slate-800 tracking-tight font-sans">AgriCollect</h1>
            <h2 class="text-sm font-bold text-green-600 tracking-[0.3em] uppercase">Chefchaouen</h2>
            <div
                class="inline-flex items-center gap-1.5 px-3 py-1 bg-green-100 text-green-700 text-[10px] font-bold uppercase tracking-wide rounded-full mt-2">
                <span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span>
                Version 2.0 • Officielle
            </div>
        </div>

        <!-- Download Button -->
        <a href="AgriCollectChefchaouen.apk"
            class="relative z-10 group block w-full bg-gradient-to-r from-emerald-600 to-green-500 hover:from-emerald-500 hover:to-green-400 text-white font-bold py-4 rounded-2xl shadow-xl shadow-green-200 hover:shadow-green-300 transform hover:-translate-y-1 transition-all duration-300">
            <div class="flex items-center justify-center gap-3">
                <svg class="w-6 h-6 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                </svg>
                <span class="text-lg tracking-wide">TÉLÉCHARGER</span>
            </div>
        </a>
        <p class="text-xs text-slate-400 mt-3 font-medium">Fichier sécurisé • APK Android</p>

        <!-- Instructions -->
        <div class="relative z-10 mt-8 bg-slate-50 rounded-2xl p-5 text-left border border-slate-100">
            <h3 class="text-xs font-bold text-slate-700 uppercase tracking-wider mb-2 flex items-center gap-2">
                <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                Installation
            </h3>
            <ol class="text-[11px] text-slate-600 space-y-2 font-medium leading-relaxed pl-1">
                <li>1. Cliquez sur le bouton <strong>Télécharger</strong>.</li>
                <li>2. Ouvrez le fichier téléchargé.</li>
                <li>3. Si demandé, autorisez l'installation depuis cette source.</li>
            </ol>
        </div>

        <div class="mt-8 pt-6 border-t border-slate-100">
            <p
                class="text-[10px] text-slate-400 font-bold uppercase tracking-[0.2em] hover:text-green-600 transition-colors cursor-default">
                Designed & Developed by MAKRANE Hamid</p>
        </div>
    </div>
</body>

</html>
